<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Application UI</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom External CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Container -->
    <div class="app-container">
        
        <!-- Header Section -->
        <header class="app-header">
            <div class="brand">
                <i class="fa-solid fa-cube logo-icon"></i>
                <h2>Dashboard</h2>
            </div>
            <button class="icon-btn" id="theme-toggle" aria-label="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <!-- Main Content Area -->
        <main class="app-main">
            <!-- Sidebar / Control Panel -->
            <aside class="sidebar">
                <div class="card">
                    <h3><i class="fa-solid fa-sliders"></i> Controls</h3>
                    <div class="form-group">
                        <label for="project-name">Project Name</label>
                        <input type="text" id="project-name" class="input-field" placeholder="Enter project name...">
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" class="select-field">
                            <option value="web">Web Application</option>
                            <option value="game">Game Design</option>
                            <option value="ai">AI Tool</option>
                        </select>
                    </div>
                    <button class="btn btn-primary">
                        <i class="fa-solid fa-plus"></i> Create New
                    </button>
                </div>
            </aside>

            <!-- Content Area -->
            <section class="content-area">
                <div class="card">
                    <h3><i class="fa-solid fa-code"></i> Main Display</h3>
                    <p class="description-text">
                        ဒီမှာ သင့်ရဲ့ Application Content သို့မဟုတ် Work Area ကို ထည့်သွင်း အသုံးပြုနိုင်ပါတယ်။
                    </p>
                    <div class="action-bar">
                        <button class="btn btn-secondary">
                            <i class="fa-solid fa-download"></i> Export File
                        </button>
                        <button class="btn btn-outline">
                            <i class="fa-solid fa-rotate-right"></i> Reset
                        </button>
                    </div>
                </div>
            </section>
        </main>

    </div>

</body>
</html>
